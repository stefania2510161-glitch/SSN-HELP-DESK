<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Engineer Portal — HelpDesk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root { --navy:#0d2148; --blue:#1e4db7; --accent:#e8a020; --light-bg:#f4f6fb; --border:#d6dde8; --text:#1a2340; --muted:#6b7a99; --sidebar-w:260px; }
    *, *::before, *::after { box-sizing:border-box; }
    body { margin:0; font-family:'DM Sans',sans-serif; min-height:100vh; background:var(--light-bg); color:var(--text); }
    .sidebar { width:var(--sidebar-w); position:fixed; top:0; left:0; min-height:100vh; background:var(--navy); color:#fff; display:flex; flex-direction:column; padding:1.75rem; gap:1rem; }
    .sidebar h4 { margin:0; font-family:'DM Serif Display',serif; font-size:1.5rem; }
    .sidebar hr { border-color:rgba(255,255,255,.12); margin:0; }
    .sidebar p { margin:.3rem 0 0; color:rgba(255,255,255,.75); font-size:.95rem; }
    .nav-link { color:rgba(255,255,255,.75); text-decoration:none; display:flex; align-items:center; gap:.55rem; padding:.65rem .85rem; border-radius:10px; transition:background .15s,color .15s; margin-bottom:.35rem; }
    .nav-link:hover, .nav-link.active { background:rgba(255,255,255,.08); color:#fff; }
    .nav-link i { font-size:1rem; }
    .main { margin-left:var(--sidebar-w); padding:2rem; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.75rem; padding:1rem 1.25rem; background:#fff; border:1px solid var(--border); border-radius:16px; box-shadow:0 1px 8px rgba(0,0,0,.05); }
    .topbar h3 { margin:0; font-family:'DM Serif Display',serif; font-size:1.4rem; }
    .topbar p { margin:0; color:var(--muted); }
    .card-custom { background:#fff; border:1px solid var(--border); border-radius:18px; padding:1.5rem; box-shadow:0 1px 6px rgba(0,0,0,.05); }
    .card-custom h5 { margin:0 0 1rem 0; font-size:1.05rem; color:var(--text); }
    .badge-assigned { background:#cfe2ff; color:#0a3b80; padding:.35em .75em; border-radius:999px; font-weight:700; }
    .table-responsive { overflow-x:auto; }
    .table-custom { width:100%; border-collapse:collapse; margin-top:1rem; }
    .table-custom thead th { background:var(--light-bg); color:var(--muted); padding:.9rem 1rem; text-align:left; border-bottom:1px solid var(--border); font-size:.82rem; letter-spacing:.05em; text-transform:uppercase; }
    .table-custom tbody tr { border-bottom:1px solid #eef0f6; transition:background .12s; }
    .table-custom tbody tr:hover { background:#f8f9fd; }
    .table-custom td { padding:.9rem 1rem; vertical-align:middle; font-size:.9rem; }
    .btn-primary-custom { background:linear-gradient(135deg,var(--blue),#163580); border:none; border-radius:10px; color:#fff; padding:.65rem 1rem; font-weight:600; cursor:pointer; transition:opacity .15s,transform .15s; }
    .btn-primary-custom:hover { opacity:.95; transform:translateY(-1px); }
    .empty-state { text-align:center; padding:2.5rem 1rem; color:var(--muted); }
    .empty-state i { display:block; font-size:2rem; margin-bottom:.75rem; opacity:.35; }
    @media (max-width:991px) {
      .sidebar { position:relative; width:100%; min-height:auto; }
      .main { margin-left:0; padding:1rem; }
      .topbar { flex-direction:column; align-items:flex-start; }
    }
  </style>
</head>
<body>

<aside class="sidebar">
  <h4>HelpDesk</h4>
  <hr>
  <p><i class="bi bi-person-circle"></i> <span id="eng-name">Engineer</span></p>
  <nav class="nav flex-column mt-4">
    <a class="nav-link text-white active" href="#"><i class="bi bi-tools"></i> My Tasks</a>
    <a class="nav-link text-white mt-5" href="#" onclick="doLogout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
  </nav>
</aside>

<main class="main">
  <h3>Engineer Command Center</h3>
  <p class="text-muted">Tickets assigned specifically to you.</p>

  <div class="card-custom mt-4">
    <h5>Assigned Tickets</h5>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Description</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="ticket-list">
          <tr><td colspan="5" class="text-center">Loading your tasks...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
  if (sessionStorage.getItem('role') !== 'engineer') window.location.href = '/';
  document.getElementById('eng-name').textContent = sessionStorage.getItem('full_name');
  const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

  async function loadTasks() {
    const res = await fetch('/api/tickets');
    const data = await res.json();
    if (data.success) {
      const myId = parseInt(sessionStorage.getItem('user_id'));
      const tasks = data.tickets.filter(t => t.engineer_id === myId);
      
      const imgLink = (t) => t.image_path && t.image_path !== 'null'
        ? `<div class="mt-1"><a href="/${t.image_path}" target="_blank" class="text-decoration-none small"><i class="bi bi-image"></i> View Attachment</a></div>`
        : '';

      const tbody = document.getElementById('ticket-list');
      if (tasks.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center">No tasks assigned to you.</td></tr>';
        return;
      }

      tbody.innerHTML = tasks.map(t => `
        <tr>
          <td>#${t.id}</td>
          <td>${t.issue_type}</td>
          <td>${t.description}${imgLink(t)}</td>
          <td><span class="badge badge-assigned">${t.status}</span></td>
          <td>
            <button class="btn btn-sm btn-success" onclick="closeTicket(${t.id})">Resolve</button>
          </td>
        </tr>
      `).join('');
    }
  }

  async function closeTicket(id) {
    const res = await fetch('/api/close_ticket', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrfToken
      },
      body: JSON.stringify({ ticket_id: id })
    });
    const data = await res.json();
    if (data.success) {
      alert('Ticket marked as resolved.');
      loadTasks();
    }
  }

  function doLogout() {
    sessionStorage.clear();
    fetch('/api/logout', { 
      method: 'POST',
      headers: {
        'X-CSRFToken': csrfToken
      }
    }).finally(() => { window.location.href = '/'; });
  }

  loadTasks();
</script>
</body>
</html>
